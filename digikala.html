<!doctype html>
<html lang="IR-fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فروشگاه اینترنتی دیجی کالا</title>
    <meta name="keywords" content="فروشگاه انلاین موبایل و لبتاپ" />
    <meta name="description" content="ما میخوایم بفروشیم لطفا بخرید" />
    <meta name="robots" content="index,follow" />
    <link
      rel="shortcut icon"
      href="./imge/icon/footerlogo2.ico"
      type="imge/x-icon"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./node_modules/swiper/swiper-bundle.min.css" />
  </head>
  <body>
    <!--#region wrapper-->
    <div class="wrapper">
      <!-- #region header -->
      <div class="header">
        <div class="header-banner">
          <img src="./imge/header-banner.webp" alt="header-banner" />
        </div>
        <div class="header-search">
          <div class="header-search-center">
            <div class="header-search-center-right">
              <div class="header-search-right-logo">
                <img src="./imge/svg/header-logo-right.svg" alt="" />
              </div>
              <div class="header-search-right-search-box">
                <input class="box-border" type="text" placeholder="جستجو" />
              </div>
            </div>
            <div class="header-search-center-left">
              <img
                class="header-search-left-logo-bell"
                src="./imge/svg/header-left-logo-bell.svg"
                alt="logo-bell-svg"
              />
              <a href="#" class="header-search-left-rigester"
                ><img
                  src="./imge/svg/header-left-logo-arrow.svg"
                  alt="logo-arrow-svg"
                />
                ورود
                <div></div>
                ثبت نام
              </a>
              <div class="line"></div>
              <div class="header-search-left-basket">
                <img
                  class="header-search-left-basket"
                  src="./imge/svg/basket.svg"
                  alt="basket-svg"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="header-menu">
        <div class="header-menu-cente">
          <div class="header-menu-right">
            <div>
              <a href="#" class="active">
                <img src="./imge/svg/01.svg" alt="" />
                دسته بندی کالاها
              </a>
            </div>
            <div class="line"></div>
            <div>
              <a href="#">
                <img src="./imge/svg/02.svg" alt="" />
                شگفت انگیزها
              </a>
            </div>
            <div>
              <a href="#">
                <img src="./imge/svg/03.svg" alt="" />
                سوپر مارکت
              </a>
            </div>
            <div>
              <a href="#">
                <img src="./imge/svg/04.svg" alt="" />
                طلا و نقره دیجیتال
              </a>
            </div>
            <div>
              <a href="#">
                <img src="./imge/svg/05.svg" alt="" />
                پرفروش ترین ها
              </a>
            </div>
            <div>
              <a href="#">
                <img src="./imge/svg/06.svg" alt="" />
                دیجی استایل
              </a>
            </div>
            <div class="line"></div>
            <div>
              <a href="#">
                <img src="" alt="" />
                در دیجی کالا بفروشید!
              </a>
            </div>
          </div>
        </div>
        <div class="header-right-menu">
          <div class="header-menu-left">
            <p>
              <img
                src="./imge/svg/location-pin-alt-1-svgrepo-com.svg"
                alt="location-svg"
              />
              انتخاب آدرس
            </p>
          </div>
        </div>
        <!-- #endregion header -->
      </div>
    </div>
    <!--#endregion wrapper-->
    <!-- #region slider -->
    <swiper-container
      class="mySwiper"
      navigation="true"
      pagination="true"
      keyboard="true"
      mousewheel="true"
      css-mode="true"
    >
      <a href="./css/slider.css"></a>
      <swiper-slide><img src="./imge/img-1.png" alt="" /></swiper-slide>
      <swiper-slide><img src="./imge/img-2.png" alt="" /></swiper-slide>
      <swiper-slide><img src="./imge/img-3.png" alt="" /></swiper-slide>
      <swiper-slide><img src="./imge/img-4.png" alt="" /></swiper-slide>
    </swiper-container>
    <!-- #endregion slider -->

    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-element-bundle.min.js"></script>
  </body>
</html>
